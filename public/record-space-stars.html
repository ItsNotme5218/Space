<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Stars — Record Pre-render</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #050312;
        font-family: system-ui, sans-serif;
        color: #fff;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #ui {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        align-items: center;
        z-index: 100;
        background: rgba(10, 8, 20, 0.8);
        backdrop-filter: blur(12px);
        padding: 12px 24px;
        border-radius: 16px;
        border: 1px solid rgba(139, 92, 246, 0.3);
      }
      button {
        padding: 10px 20px;
        border-radius: 10px;
        border: 1px solid rgba(139, 92, 246, 0.4);
        background: rgba(139, 92, 246, 0.15);
        color: #c0a8ff;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s;
      }
      button:hover {
        background: rgba(139, 92, 246, 0.3);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #status {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        min-width: 200px;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <button id="btn" onclick="startRecording()">Record Full Cycle</button>
      <span id="status">Ready — runs animation at max quality, records as WebM</span>
    </div>
    <script>
      // ── Config (max quality, identical to SpaceStars.tsx CONFIG) ─────────
      const C = {
        totalStars: 4500,
        minStars: 200,
        maxStars: 4500,
        backgroundStars: 1750,
        galaxyRadius: 750,
        galaxyTiltX: 0.84,
        galaxyTiltY: 0.35,
        rotationSpeed: 0.0008,
        differentialRotation: 3,
        chaosAmount: 0.153,
        orbitEccentricity: 0.284,
        coreSize: 0.15,
        spiralArms: 6,
        spiralTightness: 2,
        coreSpread: 1,
        edgeSpread: 2,
        timing: {
          swirlDuration: 3000,
          swirlDecelerateDuration: 50,
          preImplodeDuration: 550,
          formDuration: 10000,
          preExplodeDuration: 1000,
          waitDuration: 2500,
          implodeDuration: 1000,
          explodeDuration: 700,
          returnDuration: 10000,
        },
        text: {
          value: "Space v2",
          fontFamily: "system-ui,-apple-system,BlinkMacSystemFont,sans-serif",
          weight: 700,
          sizePx: 217,
          sampleStep: 1,
          alphaThreshold: 181,
          jitter: 1,
          breatheStrength: 1,
        },
        starStyle: {
          galaxy: {
            sizeMul: 1,
            alphaMul: 1,
            brightnessMul: 1,
            depthAlphaMin: 0.55,
            depthAlphaMax: 1,
            depthScaleMin: 0.75,
            depthScaleMax: 1.35,
            glowBlurMul: 1.2,
          },
          galaxyBackground: { sizeMul: 1, alphaMul: 1, brightnessMul: 1, glowBlurMul: 0.85 },
          twinkle: { enabled: true, base: 0.8, amp: 0.5, speedMul: 1 },
          drift: {
            enabled: true,
            galaxyAmpMin: 0.08,
            galaxyAmpMax: 0.35,
            galaxySpeedMin: 0.15,
            galaxySpeedMax: 0.45,
            galaxyBgAmpMin: 0.06,
            galaxyBgAmpMax: 0.22,
            galaxyBgSpeedMin: 0.12,
            galaxyBgSpeedMax: 0.38,
          },
        },
        nebula: {
          enabled: true,
          count: 3,
          baseAlpha: 0.19,
          alphaPulse: 0.103,
          driftSpeed: 0.08,
          blurMin: 63,
          blurMax: 98,
          blurPulse: 3.5,
          wobbleAmp: 0.06,
          radiusMin: 500,
          radiusMax: 960,
          fearOfCenter: 0.006,
          confidenceFromSize: 800,
          confidenceFromBlur: 85,
          colors: [
            "rgba(160,110,255,1)",
            "rgba(208,150,255,1)",
            "rgba(120,80,255,1)",
            "rgba(255,120,220,1)",
          ],
        },
        background: {
          fill: "#050312",
          vignette: true,
          vignetteStrength: 0.03,
          distantStars: 1200,
          distantSizeMin: 0.55,
          distantSizeMax: 1.35,
          distantAlpha: 0.23,
          distantTwinkle: 0.0012,
          distantTwinkleAmp: 0.35,
          distantDriftSpeed: 0.007,
          farStars: 750,
          farSizeMin: 0.9,
          farSizeMax: 2.2,
          farAlpha: 0.12,
          farTwinkle: 0.001,
          farTwinkleAmp: 0.35,
          farDriftSpeed: 0.012,
          grade: { enabled: true, alpha: 0.06, radiusMul: 0.95 },
        },
        render: {
          dprCap: 2,
          sortByDepth: true,
          sortEveryNFrames: 2,
          maxDt: 33,
          motionBlurStrength: 0.56,
        },
      };

      const ST = {
        SWIRLING: 0,
        PRE_IMPLODING: 1,
        FORMING: 2,
        PRE_EXPLODING: 3,
        WAITING: 4,
        IMPLODING: 5,
        EXPLODING: 6,
        RETURNING: 7,
      };

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { alpha: false });
      const btn = document.getElementById("btn");
      const statusEl = document.getElementById("status");

      let W, H, cx, cy, dpr;
      let stars = [],
        textPts = [],
        sprites = new Map();
      let bgDistant = [],
        bgFar = [],
        nebulae = [];
      let globalRot = 0,
        stateTimer = 0,
        breathe = 0,
        lastTime = 0,
        frameIdx = 0;
      let curState = ST.SWIRLING;
      let recording = false,
        recorder = null,
        chunks = [];
      let cycleComplete = false;

      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
      const easeOutExpo = (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t));
      const easeInExpo = (t) => (t === 0 ? 0 : Math.pow(2, 10 * t - 10));
      const easeInOutQuad = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, C.render.dprCap);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * dpr);
        canvas.height = Math.floor(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = W / 2;
        cy = H / 2;
      }

      function getSprite(size) {
        const key = Math.round(Math.max(0.1, size) * 10);
        if (sprites.has(key)) return sprites.get(key);
        const n = key / 10,
          px = Math.max(3, Math.ceil(n * 7));
        const c = document.createElement("canvas");
        c.width = px;
        c.height = px;
        const g = c.getContext("2d"),
          hx = px / 2,
          hy = px / 2;
        g.fillStyle = "rgba(255,255,255,.95)";
        g.shadowBlur = n * 3 * C.starStyle.galaxy.glowBlurMul;
        g.shadowColor = "rgba(210,180,255,.55)";
        g.beginPath();
        for (let i = 0; i < 8; i++) {
          const r = i % 2 === 0 ? n * 2.2 : n * 0.55;
          const a = (i * Math.PI) / 4 - Math.PI / 2;
          i === 0
            ? g.moveTo(hx + Math.cos(a) * r, hy + Math.sin(a) * r)
            : g.lineTo(hx + Math.cos(a) * r, hy + Math.sin(a) * r);
        }
        g.closePath();
        g.fill();
        g.shadowBlur = 0;
        g.beginPath();
        g.arc(hx, hy, n * 0.55, 0, Math.PI * 2);
        g.fill();
        sprites.set(key, c);
        return c;
      }

      function genTextPts() {
        const tmp = document.createElement("canvas");
        tmp.width = W;
        tmp.height = H;
        const g = tmp.getContext("2d");
        g.fillStyle = "#fff";
        g.font = `${C.text.weight} ${C.text.sizePx}px ${C.text.fontFamily}`;
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(C.text.value, W / 2, H / 2);
        const img = g.getImageData(0, 0, W, H).data;
        textPts = [];
        for (let y = 0; y < H; y += C.text.sampleStep)
          for (let x = 0; x < W; x += C.text.sampleStep)
            if (img[(y * W + x) * 4 + 3] > C.text.alphaThreshold) textPts.push({ x, y });
        for (let i = textPts.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          [textPts[i], textPts[j]] = [textPts[j], textPts[i]];
        }
      }

      function makeStar(isBg) {
        const D = C.starStyle.drift;
        const s = {
          isBg,
          x: 0,
          y: 0,
          z: 0,
          size: 0,
          bright: 0,
          radius: 0,
          initAngle: 0,
          orbitFactor: 1,
          ecc: 0,
          eccAngle: 0,
          zOff: 0,
          twOff: Math.random() * Math.PI * 2,
          twSpd: 0.5 + Math.random() * 1.2,
          chaosPhase: Math.random() * Math.PI * 2,
          homeX: 0,
          homeY: 0,
          startX: 0,
          startY: 0,
          startZ: 0,
          targetX: 0,
          targetY: 0,
          targetZ: 0,
          tpIdx: -1,
          driftPhase: Math.random() * Math.PI * 2,
          driftSpd: isBg
            ? rand(D.galaxyBgSpeedMin, D.galaxyBgSpeedMax)
            : rand(D.galaxySpeedMin, D.galaxySpeedMax),
          driftAmp: isBg
            ? rand(D.galaxyBgAmpMin, D.galaxyBgAmpMax)
            : rand(D.galaxyAmpMin, D.galaxyAmpMax),
          sprite: null,
        };
        if (isBg) {
          s.size = Math.random() * 0.5 + 0.25;
          s.bright = 0.22 + Math.random() * 0.33;
          s.x = Math.random() * W;
          s.y = Math.random() * H;
          s.homeX = s.x;
          s.homeY = s.y;
          s.radius = Math.random() * C.galaxyRadius * 1.5;
          s.initAngle = Math.random() * Math.PI * 2;
          s.z = -300;
          s.orbitFactor = 0.5;
        } else {
          const t = Math.pow(Math.random(), 0.7);
          s.radius = t * C.galaxyRadius;
          const inCore = t < C.coreSize;
          const spread = inCore
            ? C.coreSpread
            : 1 + (C.edgeSpread - C.coreSpread) * ((t - C.coreSize) / 0.75);
          const arm = Math.floor(Math.random() * C.spiralArms);
          s.initAngle =
            (arm / C.spiralArms) * Math.PI * 2 +
            (s.radius / C.galaxyRadius) * Math.PI * C.spiralTightness +
            (Math.random() - 0.5) * ((Math.PI * 2) / C.spiralArms) * spread;
          s.orbitFactor = 1 + (1 - t) * C.differentialRotation;
          s.ecc = Math.random() * C.orbitEccentricity;
          s.eccAngle = Math.random() * Math.PI * 2;
          s.zOff = (Math.random() - 0.5) * 60 * (1 - t * 0.5);
          if (inCore) {
            s.size = Math.random() * 1.15 + 0.65;
            s.bright = 1.35 + Math.random() * 0.35;
          } else if (t < 0.5) {
            s.size = Math.random() * 0.85 + 0.45;
            s.bright = 1 + Math.random() * 0.25;
          } else {
            s.size = Math.random() * 0.65 + 0.35;
            s.bright = 0.65 + Math.random() * 0.35;
          }
          updatePos(s, 0, 0);
          s.homeX = s.x;
          s.homeY = s.y;
        }
        s.startX = s.x;
        s.startY = s.y;
        s.startZ = s.z;
        s.targetX = s.x;
        s.targetY = s.y;
        s.targetZ = s.z;
        s.sprite = getSprite(s.size);
        return s;
      }

      function updatePos(s, rot, time) {
        const a = s.initAngle + rot * s.orbitFactor;
        const rr = s.radius * (1 + s.ecc * Math.cos(a - s.eccAngle));
        const chX = Math.sin(time * 3 + s.chaosPhase) * 0.035 * s.radius;
        const chY = Math.cos(time * 4 + s.chaosPhase) * C.chaosAmount * s.radius;
        s.x = cx + (Math.cos(a) * rr + chX) * C.galaxyTiltX;
        s.y = cy + (Math.sin(a) * rr + chY) * C.galaxyTiltY;
        s.z = s.zOff + (Math.sin(a) * rr + chY) * 0.25;
      }

      function drawStar(s, now) {
        const time = now * 0.001;
        const TW = C.starStyle.twinkle;
        let tw = TW.enabled
          ? TW.base + Math.sin(now * 0.005 * s.twSpd * TW.speedMul + s.twOff) * TW.amp
          : 1;
        let alpha = tw,
          scale = 1;
        if (s.isBg) {
          const S = C.starStyle.galaxyBackground;
          alpha *= s.bright * S.alphaMul * S.brightnessMul;
          scale = 0.95 * S.sizeMul;
        } else {
          const S = C.starStyle.galaxy;
          const d = clamp((s.z + 100) / 200, 0, 1);
          alpha *=
            lerp(S.depthAlphaMin, S.depthAlphaMax, d) * s.bright * S.alphaMul * S.brightnessMul;
          scale = lerp(S.depthScaleMin, S.depthScaleMax, d) * S.sizeMul;
        }
        if (curState === ST.WAITING) alpha *= 0.9 + Math.sin(breathe) * 0.1;
        const dx = Math.sin(time * s.driftSpd + s.driftPhase) * s.driftAmp;
        const dy = Math.cos(time * s.driftSpd + s.driftPhase) * s.driftAmp;
        ctx.globalAlpha = clamp(alpha, 0, 1);
        const w = s.sprite.width * scale,
          h = s.sprite.height * scale;
        ctx.drawImage(s.sprite, s.x + dx - w / 2, s.y + dy - h / 2, w, h);
      }

      function assignText() {
        const fg = stars.filter((s) => !s.isBg),
          bg = stars.filter((s) => s.isBg);
        let k = 0;
        for (let i = 0; i < textPts.length && k < fg.length; i++) {
          fg[k].tpIdx = i;
          fg[k].targetX = textPts[i].x;
          fg[k].targetY = textPts[i].y;
          k++;
        }
        let b = 0;
        for (let i = k; i < textPts.length && b < bg.length; i++) {
          bg[b].tpIdx = i;
          bg[b].targetX = textPts[i].x;
          bg[b].targetY = textPts[i].y;
          b++;
        }
      }

      function makeBgLayer(n, sMin, sMax, drift, twinkle) {
        const arr = [];
        for (let i = 0; i < n; i++) {
          const a = rand(0, Math.PI * 2);
          arr.push({
            x: Math.random() * W,
            y: Math.random() * H,
            vx: Math.cos(a) * rand(0.35, 1),
            vy: Math.sin(a) * rand(0.35, 1),
            s: rand(sMin, sMax),
            tw: rand(0, Math.PI * 2),
            twSpd: rand(twinkle * 0.6, twinkle * 1.4),
            drift,
            jit: rand(0, Math.PI * 2),
          });
        }
        return arr;
      }

      function initNeb() {
        nebulae = [];
        if (!C.nebula.enabled) return;
        for (let i = 0; i < C.nebula.count; i++) {
          const dir = rand(0, Math.PI * 2),
            spd = rand(0.6, 1.25);
          nebulae.push({
            x: rand(-0.25, 1.25) * W,
            y: rand(-0.25, 1.25) * H,
            baseR: rand(C.nebula.radiusMin, C.nebula.radiusMax),
            c0: C.nebula.colors[(Math.random() * C.nebula.colors.length) | 0],
            c1: C.nebula.colors[(Math.random() * C.nebula.colors.length) | 0],
            vx: Math.cos(dir) * spd,
            vy: Math.sin(dir) * spd,
            blur: rand(C.nebula.blurMin, C.nebula.blurMax),
            blurPhase: rand(0, Math.PI * 2),
            blurSpeed: rand(0.06, 0.22),
            aPhase: rand(0, Math.PI * 2),
            aSpeed: rand(0.12, 0.42),
            wobPhase: rand(0, Math.PI * 2),
            wobSpeed: rand(0.06, 0.22),
          });
        }
      }

      function drawBgLayer(layer, baseAlpha, now, dt, pMul, twAmp) {
        ctx.save();
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#fff";
        for (const s of layer) {
          s.x += (s.vx * s.drift + Math.sin(globalRot * pMul + s.jit) * 0.08) * dt;
          s.y += s.vy * s.drift * dt;
          if (s.x < -3) s.x = W + 3;
          if (s.x > W + 3) s.x = -3;
          if (s.y < -3) s.y = H + 3;
          if (s.y > H + 3) s.y = -3;
          ctx.globalAlpha = clamp(
            baseAlpha * (0.65 + Math.sin(now * s.twSpd + s.tw) * twAmp),
            0,
            1,
          );
          ctx.fillRect(s.x, s.y, s.s, s.s);
        }
        ctx.restore();
      }

      function drawNeb(now, dt) {
        if (!C.nebula.enabled || !nebulae.length) return;
        const t = now * 0.001;
        ctx.save();
        ctx.globalCompositeOperation = "screen";
        for (const b of nebulae) {
          b.x += b.vx * C.nebula.driftSpeed * dt;
          b.y += b.vy * C.nebula.driftSpeed * dt;
          const dx = b.x - cx,
            dy = b.y - cy,
            dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const sC = (b.baseR - C.nebula.radiusMin) / (C.nebula.radiusMax - C.nebula.radiusMin);
          const bC = (b.blur - C.nebula.blurMin) / (C.nebula.blurMax - C.nebula.blurMin);
          const fear =
            C.nebula.fearOfCenter *
            (1 - (sC * C.nebula.confidenceFromSize + bC * C.nebula.confidenceFromBlur));
          const minD = 200 + fear * 600;
          if (dist < minD) {
            const sc = minD / dist;
            b.x = cx + dx * sc;
            b.y = cy + dy * sc;
          }
          const margin = Math.max(C.nebula.radiusMax, 900);
          if (b.x < -margin) b.x = W + margin;
          if (b.x > W + margin) b.x = -margin;
          if (b.y < -margin) b.y = H + margin;
          if (b.y > H + margin) b.y = -margin;
          const a = C.nebula.baseAlpha + Math.sin(t * b.aSpeed + b.aPhase) * C.nebula.alphaPulse;
          const wob = 1 + Math.sin(t * b.wobSpeed + b.wobPhase) * C.nebula.wobbleAmp;
          const blur = b.blur + Math.sin(t * b.blurSpeed + b.blurPhase) * C.nebula.blurPulse;
          ctx.filter = `blur(${Math.max(0, blur)}px)`;
          ctx.globalAlpha = clamp(a, 0, 1);
          const r = b.baseR * wob,
            g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
          g.addColorStop(0, b.c0);
          g.addColorStop(0.55, b.c1);
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        ctx.filter = "none";
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }

      function updateState(dt) {
        stateTimer += dt;
        const time = performance.now() * 0.001,
          T = C.timing;
        if (curState === ST.SWIRLING) {
          const total = T.swirlDuration + T.swirlDecelerateDuration;
          let sm = 1;
          if (stateTimer > T.swirlDuration) {
            const t = clamp((stateTimer - T.swirlDuration) / T.swirlDecelerateDuration, 0, 1);
            sm = 1 - Math.pow(1 - (1 - t), 4);
          }
          globalRot += C.rotationSpeed * dt * sm;
          for (const s of stars) if (!s.isBg) updatePos(s, globalRot, time);
          if (stateTimer >= total) {
            curState = ST.PRE_IMPLODING;
            stateTimer = 0;
            for (const s of stars) {
              s.startX = s.x;
              s.startY = s.y;
              s.startZ = s.z;
              const a = Math.random() * Math.PI * 2,
                b = Math.random() * Math.PI,
                r = 15 + Math.random() * 22;
              s.targetX = cx + r * Math.sin(b) * Math.cos(a);
              s.targetY = cy + r * Math.sin(b) * Math.sin(a);
              s.targetZ = s.z;
            }
          }
          return;
        }
        if (curState === ST.PRE_IMPLODING) {
          const t = clamp(stateTimer / T.preImplodeDuration, 0, 1),
            e = easeInExpo(t);
          for (const s of stars) {
            if (s.isBg) continue;
            s.x = lerp(s.startX, s.targetX, e);
            s.y = lerp(s.startY, s.targetY, e);
            s.z = lerp(s.startZ, s.targetZ, e);
          }
          if (stateTimer >= T.preImplodeDuration) {
            curState = ST.FORMING;
            stateTimer = 0;
            for (const s of stars) {
              s.startX = s.x;
              s.startY = s.y;
            }
            assignText();
            for (const s of stars) {
              s.startX = s.x;
              s.startY = s.y;
            }
          }
          return;
        }
        if (curState === ST.FORMING) {
          const t = clamp(stateTimer / T.formDuration, 0, 1),
            e = easeOutExpo(t);
          for (const s of stars) {
            s.x = lerp(s.startX, s.targetX, e);
            s.y = lerp(s.startY, s.targetY, e);
            s.z *= 1 - e * 0.2;
          }
          if (stateTimer >= T.formDuration) {
            curState = ST.PRE_EXPLODING;
            stateTimer = 0;
            for (const s of stars) {
              s.startX = s.x;
              s.startY = s.y;
            }
          }
          return;
        }
        if (curState === ST.PRE_EXPLODING) {
          const t = clamp(stateTimer / T.preExplodeDuration, 0, 1),
            e = easeOutExpo(t);
          for (const s of stars) {
            s.x = lerp(s.startX, s.targetX, e);
            s.y = lerp(s.startY, s.targetY, e);
            s.z *= 1 - e * 0.2;
          }
          if (stateTimer >= T.preExplodeDuration) {
            curState = ST.WAITING;
            stateTimer = 0;
            breathe = 0;
          }
          return;
        }
        if (curState === ST.WAITING) {
          breathe += dt * 0.002;
          for (const s of stars) {
            if (s.tpIdx >= 0) {
              const b = Math.sin(breathe) * C.text.breatheStrength,
                w = Math.sin(time * 4.5 + s.tpIdx) * 0.25,
                j = C.text.jitter;
              s.x = s.targetX + Math.sin(breathe + s.tpIdx * 0.1) * b * 0.22 * j + w;
              s.y = s.targetY + Math.cos(breathe + s.tpIdx * 0.1) * b * 0.22 * j + w;
            } else if (!s.isBg) updatePos(s, globalRot, time);
          }
          globalRot += C.rotationSpeed * dt * 0.1;
          if (stateTimer >= T.waitDuration) {
            curState = ST.IMPLODING;
            stateTimer = 0;
            for (const s of stars) {
              s.startX = s.x;
              s.startY = s.y;
              s.startZ = s.z;
              const a = Math.random() * Math.PI * 2,
                b = Math.random() * Math.PI,
                r = 18 + Math.random() * 18;
              s.targetX = cx + r * Math.sin(b) * Math.cos(a);
              s.targetY = cy + r * Math.sin(b) * Math.sin(a);
            }
          }
          return;
        }
        if (curState === ST.IMPLODING) {
          const t = clamp(stateTimer / T.implodeDuration, 0, 1),
            e = easeInExpo(t);
          for (const s of stars) {
            s.x = lerp(s.startX, s.targetX, e);
            s.y = lerp(s.startY, s.targetY, e);
          }
          if (stateTimer >= T.implodeDuration) {
            curState = ST.EXPLODING;
            stateTimer = 0;
            for (const s of stars) {
              s.startX = s.x;
              s.startY = s.y;
              s.startZ = s.z;
              s.targetX = (Math.random() - 0.2) * W * 1.4;
              s.targetY = (Math.random() - 0.2) * H * 1.4;
              s.targetZ = (Math.random() - 0.5) * 520;
            }
          }
          return;
        }
        if (curState === ST.EXPLODING) {
          const t = clamp(stateTimer / T.explodeDuration, 0, 1),
            e = 1 - Math.pow(1 - t, 4);
          for (const s of stars) {
            s.x = lerp(s.startX, s.targetX, e);
            s.y = lerp(s.startY, s.targetY, e);
            s.z = lerp(s.startZ, s.targetZ, e);
          }
          if (stateTimer >= T.explodeDuration) {
            curState = ST.RETURNING;
            stateTimer = 0;
            globalRot = 0;
            for (const s of stars) {
              s.startX = s.x;
              s.startY = s.y;
              s.startZ = s.z;
              if (!s.isBg) {
                const a = s.initAngle + globalRot * s.orbitFactor,
                  rr = s.radius * (1 + s.ecc * Math.cos(a - s.eccAngle));
                const chX = Math.sin(time * 3 + s.chaosPhase) * 0.035 * s.radius,
                  chY = Math.cos(time * 4 + s.chaosPhase) * C.chaosAmount * s.radius;
                s.targetX = cx + (Math.cos(a) * rr + chX) * C.galaxyTiltX;
                s.targetY = cy + (Math.sin(a) * rr + chY) * C.galaxyTiltY;
                s.targetZ = s.zOff + (Math.sin(a) * rr + chY) * 0.25;
              } else {
                s.targetX = s.homeX;
                s.targetY = s.homeY;
                s.targetZ = -300;
              }
            }
          }
          return;
        }
        if (curState === ST.RETURNING) {
          const t = clamp(stateTimer / T.returnDuration, 0, 1),
            e = easeInOutQuad(t);
          globalRot += C.rotationSpeed * dt;
          for (const s of stars) {
            let tx, ty, tz;
            if (!s.isBg) {
              const a = s.initAngle + globalRot * s.orbitFactor,
                rr = s.radius * (1 + s.ecc * Math.cos(a - s.eccAngle));
              tx = cx + Math.cos(a) * rr * C.galaxyTiltX;
              ty = cy + Math.sin(a) * rr * C.galaxyTiltY;
              tz = s.zOff + Math.sin(a) * rr * 0.25;
            } else {
              tx = s.homeX;
              ty = s.homeY;
              tz = -300;
            }
            s.x = lerp(s.startX, tx, e);
            s.y = lerp(s.startY, ty, e);
            s.z = lerp(s.startZ, tz, e);
          }
          if (stateTimer >= T.returnDuration) {
            for (const s of stars)
              if (!s.isBg) s.initAngle = (s.initAngle + globalRot * s.orbitFactor) % (Math.PI * 2);
            globalRot = 0;
            curState = ST.SWIRLING;
            stateTimer = 0;
            if (recording) {
              cycleComplete = true;
            }
          }
        }
      }

      function initAll() {
        resize();
        genTextPts();
        bgDistant = makeBgLayer(
          C.background.distantStars,
          C.background.distantSizeMin,
          C.background.distantSizeMax,
          C.background.distantDriftSpeed,
          C.background.distantTwinkle,
        );
        bgFar = makeBgLayer(
          C.background.farStars,
          C.background.farSizeMin,
          C.background.farSizeMax,
          C.background.farDriftSpeed,
          C.background.farTwinkle,
        );
        initNeb();
        stars = [];
        sprites.clear();
        globalRot = 0;
        for (let i = 0; i < C.backgroundStars; i++) stars.push(makeStar(true));
        for (let i = 0; i < C.totalStars - C.backgroundStars; i++) stars.push(makeStar(false));
        assignText();
      }

      function draw(now) {
        const dt = Math.min(now - lastTime, C.render.maxDt);
        lastTime = now;
        ctx.globalAlpha = 1;
        ctx.filter = "none";
        if (C.render.motionBlurStrength > 0) {
          ctx.globalAlpha = 1 - C.render.motionBlurStrength;
          ctx.fillStyle = C.background.fill;
          ctx.fillRect(0, 0, W, H);
        } else {
          ctx.fillStyle = C.background.fill;
          ctx.fillRect(0, 0, W, H);
        }
        ctx.globalAlpha = 1;
        drawBgLayer(
          bgDistant,
          C.background.distantAlpha,
          now,
          dt,
          0.8,
          C.background.distantTwinkleAmp,
        );
        drawBgLayer(bgFar, C.background.farAlpha, now, dt, 1.25, C.background.farTwinkleAmp);
        if (C.background.grade?.enabled) {
          const r = Math.max(W, H) * (C.background.grade.radiusMul || 0.95);
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
          g.addColorStop(0, `rgba(130,90,255,${C.background.grade.alpha})`);
          g.addColorStop(0.55, `rgba(40,20,90,${C.background.grade.alpha * 0.7})`);
          g.addColorStop(1, "rgba(0,0,0,0)");
          ctx.save();
          ctx.globalCompositeOperation = "screen";
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
        drawNeb(now, dt);
        updateState(dt);
        if (C.render.sortByDepth && frameIdx++ % (C.render.sortEveryNFrames || 1) === 0)
          stars.sort((a, b) => (a.z || 0) - (b.z || 0));
        for (const s of stars) drawStar(s, now);
        if (C.background.vignette) {
          ctx.save();
          const r = Math.max(W, H) * 0.85,
            g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
          g.addColorStop(0, "rgba(0,0,0,0)");
          g.addColorStop(1, `rgba(0,0,0,${C.background.vignetteStrength})`);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }

        if (recording && cycleComplete) {
          stopRecording();
          return;
        }
        requestAnimationFrame(draw);
      }

      function startRecording() {
        btn.disabled = true;
        statusEl.textContent = "Resetting animation...";
        // Reset state to beginning
        curState = ST.SWIRLING;
        stateTimer = 0;
        globalRot = 0;
        breathe = 0;
        cycleComplete = false;
        recording = true;
        chunks = [];
        // Re-init stars so animation starts fresh
        initAll();

        const stream = canvas.captureStream(30);
        recorder = new MediaRecorder(stream, {
          mimeType: "video/webm;codecs=vp9",
          videoBitsPerSecond: 8000000,
        });
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "space-stars-prerender.webm";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          statusEl.textContent = `Done! File downloaded (${(blob.size / 1024 / 1024).toFixed(1)} MB). Place in public/ folder.`;
          btn.disabled = false;
          recording = false;
        };
        recorder.start();
        statusEl.textContent = "Recording... (one full animation cycle ≈ 30s)";
        lastTime = performance.now();
        requestAnimationFrame(draw);
      }

      function stopRecording() {
        recording = false;
        if (recorder && recorder.state !== "inactive") recorder.stop();
      }

      // Start preview loop
      initAll();
      lastTime = performance.now();
      requestAnimationFrame(draw);
      window.addEventListener("resize", () => {
        initAll();
      });
    </script>
  </body>
</html>
